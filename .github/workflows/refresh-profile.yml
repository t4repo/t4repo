name: Refresh profile

on:
  schedule:
    # 05:12 UTC daily — off the hour, so it isn't queued behind everyone else's cron.
    - cron: "12 5 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/refresh_profile.py"
      - ".github/workflows/refresh-profile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild header banners
        run: python scripts/build_header.py

      - name: Refresh generated README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/refresh_profile.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh profile [skip ci]"
          git push
